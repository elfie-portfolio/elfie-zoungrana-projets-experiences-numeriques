<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="titre desc"><title id="titre">Où trier à Paris ?</title><desc id="desc">Paris compte 443 stations Trilib’ en service, dont 9 dans le 6e arrondissement et 46 dans le 19e.</desc><rect width="900" height="480" fill="#e7f0e8"/><rect x="36" y="36" width="828" height="408" rx="24" fill="#133a31"/><g fill="#f4f3ed" font-family="system-ui, sans-serif"><text x="72" y="93" font-size="20" letter-spacing="3">PARIS DATA · STATIONS TRILIB’</text><text x="72" y="157" font-weight="700" font-size="49">Où trier à Paris ?</text><text x="72" y="213" font-size="25">443 stations en service à Paris</text><text x="72" y="286" font-size="23">6ᵉ</text><text x="72" y="352" font-size="23">19ᵉ</text><text x="232" y="287" font-size="26" font-weight="700">9</text><text x="627" y="353" font-size="26" font-weight="700">46</text><text x="72" y="409" font-size="16">Nombre de stations par arrondissement · Ville de Paris</text></g><g fill="#afe0b6"><rect x="117" y="266" width="96" height="24" rx="7"/><rect x="117" y="332" width="491" height="24" rx="7"/></g></svg>